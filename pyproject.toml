[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pa-journal-digest"
version = "0.1.0"
description = "Daily public administration journal newsletter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=1.99,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]

[project.scripts]
pa-digest = "pa_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pa_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

